name: Phase 0 S1a Chaquopy smoke

on:
  push:
    paths:
      - "spikes/s1-python/**"
      - ".github/workflows/phase0-s1a-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-s1a-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s1a:
    name: Build and run Python/Requests smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools emulator"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install Android API 35 and x86_64 emulator image
        run: |
          sdkmanager \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"

      - name: Build debug APK
        run: gradle -p spikes/s1-python --no-daemon :app:assembleDebug

      - name: Create and boot x86_64 emulator
        run: |
          echo no | avdmanager create avd \
            --force \
            --name p003-x86_64 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_2
          emulator -avd p003-x86_64 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect \
            >/tmp/p003-emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          booted=false
          for _ in $(seq 1 90); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [ "$booted" != true ]; then
            cat /tmp/p003-emulator.log
            exit 1
          fi
          adb shell input keyevent 82

      - name: Install, launch, and assert same-process Python import
        run: |
          adb install -r \
            spikes/s1-python/app/build/outputs/apk/debug/app-debug.apk
          adb logcat -c
          adb shell am start -n \
            app.autohost.spike.s1/.MainActivity
          for _ in $(seq 1 60); do
            output="$(adb logcat -d -s AutoHostS1:I 2>/dev/null || true)"
            if grep -q "P0-03:PASS" <<<"$output"; then
              printf '%s\n' "$output"
              exit 0
            fi
            if grep -q "P0-03:FAIL" <<<"$output"; then
              printf '%s\n' "$output"
              exit 1
            fi
            sleep 2
          done
          adb logcat -d -s AutoHostS1:I
          cat /tmp/p003-emulator.log
          exit 1
