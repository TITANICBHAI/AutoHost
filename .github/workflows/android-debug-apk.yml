name: Android debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build core debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare diagnostic log directory
        run: mkdir -p ci-logs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses \
            2>&1 | tee ci-logs/android-licenses.log
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            2>&1 | tee ci-logs/android-sdk-install.log

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Record build environment
        shell: bash
        run: |
          set -o pipefail
          {
            echo "UTC time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Runner: $(uname -a)"
            echo "Workspace disk:"
            df -h "$GITHUB_WORKSPACE"
            echo
            echo "Java:"
            java -version
            echo
            echo "Gradle:"
            gradle --version
            echo
            echo "Android SDK root: $ANDROID_HOME"
            echo "Installed Android packages:"
            sdkmanager --sdk_root="$ANDROID_HOME" --list_installed
          } 2>&1 | tee ci-logs/build-environment.log

      - name: Build app and fixture debug variants
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleCoreDebug :testing:fixture-app:assembleDebug \
            --console=plain \
            --stacktrace \
            --warning-mode=all \
            --info \
            2>&1 | tee ci-logs/gradle-build.log

      - name: Record APK checksum
        if: success()
        shell: bash
        run: |
          apk="app/build/outputs/apk/core/debug/app-core-debug.apk"
          test -f "$apk"
          sha256sum "$apk" | tee ci-logs/apk-sha256.txt

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -o pipefail
          {
            echo "UTC time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Runner disk:"
            df -h
            echo
            echo "Runner memory:"
            free -h
            echo
            echo "Gradle daemon status:"
            gradle --status || true
            echo
            echo "Available build reports:"
            for dir in app/build/reports testing/fixture-app/build/reports; do
              if [[ -d "$dir" ]]; then
                find "$dir" -maxdepth 5 -type f -printf '%p (%s bytes)\n'
              else
                echo "$dir: not created"
              fi
            done
          } 2>&1 | tee ci-logs/failure-diagnostics.log

      - name: Collect Gradle daemon logs
        if: always()
        shell: bash
        run: |
          mkdir -p ci-logs/gradle-daemon
          if [[ -d "$HOME/.gradle/daemon" ]]; then
            find "$HOME/.gradle/daemon" -type f -name 'daemon-*.out.log' \
              -exec cp --parents {} ci-logs/gradle-daemon/ \;
          fi

      - name: Upload core debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: autohost-core-debug-${{ github.run_number }}
          path: app/build/outputs/apk/core/debug/app-core-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ github.run_number }}
          path: |
            ci-logs/
            app/build/reports/
            testing/fixture-app/build/reports/
          if-no-files-found: warn
          retention-days: 14
