# CI — the verification workflow (X-08, promoted from drafts/ci.workflow.yml on 2026-11-03, ADR-085).
# python-suites: every stdlib-Python check (no Android SDK needed).
# jvm-tests: the full JVM unit-test sweep (`gradle test`). No debug assemblies here —
#   .github/workflows/android-debug-apk.yml owns the APK/fixture build (one build, no duplicates).
# The emulator job was REMOVED by owner decision D-24 (2026-11-03): CI never runs emulators.
# Gradle is pinned to 8.13 (docs/VERSIONS.md; X-07 chose the documented-pin route, no wrapper).
# Failing steps tee their log and emit the failure lines as ::error:: annotations — run logs need
# admin access to download, annotations are readable by anyone on the run page.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-suites:
    name: Python suites and consistency checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies (PyYAML — SDK stays stdlib-only)
        run: python3 -m pip install --quiet -r sdk-python/requirements-test.txt
      - name: SDK + simulator suite
        working-directory: sdk-python
        shell: bash
        run: |
          set +e   # GitHub's shell: bash implies -e; a failing pipeline must not exit before the guard
          python3 -m unittest discover -s tests -t tests -p "test_*.py" 2>&1 | tee /tmp/sdk_suite.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "^(FAIL|ERROR): " /tmp/sdk_suite.log | head -5 | while read -r l; do echo "::error::$l"; done
            tail -4 /tmp/sdk_suite.log | while read -r l; do echo "::error::${l:0:250}"; done
            exit "$rc"
          fi
      - name: Root suite (schemas, tracker, docs, architecture)
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -p "test_*.py" 2>&1 | tee /tmp/root_suite.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "^(FAIL|ERROR): " /tmp/root_suite.log | head -5 | while read -r l; do echo "::error::$l"; done
            tail -4 /tmp/root_suite.log | while read -r l; do echo "::error::${l:0:250}"; done
            exit "$rc"
          fi
      - name: Consistency and drift checks
        shell: bash
        run: |
          set -o pipefail
          python3 tools/progress.py --check
          python3 tools/doc_check.py
          python3 tools/gen_artifacts.py --check
          python3 tools/sync_sdk.py --check
          python3 tools/licence_check.py
          python3 tools/mcp_eval.py
      - name: Golden vectors drift
        shell: bash
        run: |
          set -o pipefail
          python3 tools/gen_flow_vectors.py > /dev/null && git diff --exit-code testing/golden/flow_vectors.json
          python3 tools/gen_schedule_vectors.py > /dev/null && git diff --exit-code testing/golden/schedule_vectors.json

  jvm-core:
    name: JVM tests - core modules
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # Chaquopy 17 needs a build-machine Python 3.13 (docs/VERSIONS.md)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Disk before build
        run: df -h / | tail -1
      - name: Core JVM tests
        shell: bash
        run: |
          set +e
          gradle :core:common:test :core:model:test :core:broker:test :core:engine:test :core:data:test :core:devapi:test :core:designsystem:test :runtime:js:test --continue --console=plain --stacktrace 2>&1 | tee /tmp/jvm.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "^> Task .*FAILED" /tmp/jvm.log | head -2 | while read -r l; do echo "::error::${l:0:250}"; done
            exit "$rc"
          fi
      - name: Failing test details
        if: failure()
        shell: bash
        run: |
          python3 tools/test_report_digest.py . | head -6 | while read -r l; do echo "::error::${l:0:250}"; done
          grep -E "^[a-zA-Z].* > .*FAILED$|^ +[a-z]+\.[a-zA-Z.0-9]*(Exception|Error): |^ +Condition not satisfied|^ +Expected|^ +     but:" /tmp/jvm.log | head -6 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Kotlin errors 1-9
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " /tmp/jvm.log | head -9 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Kotlin errors 10-18
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " /tmp/jvm.log | tail -n +10 | head -9 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Kotlin errors 19-27
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " /tmp/jvm.log | tail -n +19 | head -9 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-core-test-reports-${{ github.run_number }}
          path: "**/build/reports/tests/"
          if-no-files-found: warn
          retention-days: 7

  jvm-capabilities:
    name: JVM tests - capabilities and app
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # Chaquopy 17 needs a build-machine Python 3.13 (docs/VERSIONS.md)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Disk before build
        run: df -h / | tail -1
      - name: Capability and app JVM tests
        shell: bash
        run: |
          set +e
          gradle :runtime:python:test :runtime:flow:test :plugin-sdk:test :capabilities:a11y:test :capabilities:app:test :capabilities:ime:test :capabilities:screen:test :capabilities:projection:test :capabilities:notifications:test :capabilities:clipboard:test :capabilities:intents:test :capabilities:files:test :capabilities:audio:test :capabilities:net:test :capabilities:rawbridge:test :capabilities:shell:test :capabilities:browser:test :capabilities:vision:test :capabilities:data:test :app:test :testing:fixture-app:test --continue --console=plain --stacktrace 2>&1 | tee /tmp/jvm.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "^> Task .*FAILED" /tmp/jvm.log | head -2 | while read -r l; do echo "::error::${l:0:250}"; done
            exit "$rc"
          fi
      - name: Failing test details
        if: failure()
        shell: bash
        run: |
          python3 tools/test_report_digest.py . | head -6 | while read -r l; do echo "::error::${l:0:250}"; done
          grep -E "^[a-zA-Z].* > .*FAILED$|^ +[a-z]+\.[a-zA-Z.0-9]*(Exception|Error): |^ +Condition not satisfied|^ +Expected|^ +     but:" /tmp/jvm.log | head -6 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Kotlin errors 1-9
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " /tmp/jvm.log | head -9 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Kotlin errors 10-18
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " /tmp/jvm.log | tail -n +10 | head -9 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Kotlin errors 19-27
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " /tmp/jvm.log | tail -n +19 | head -9 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-capabilities-test-reports-${{ github.run_number }}
          path: "**/build/reports/tests/"
          if-no-files-found: warn
          retention-days: 7
