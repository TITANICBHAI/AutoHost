# JVM core sweep — split out of ci.yml on the owner's instruction (2026-11-04).
# Runs :core:* and :runtime:js tests independently of the Python suites and the
# capabilities+app sweep (jvm-capabilities.yml), so each can iterate without
# waiting on the others.
# Gradle is pinned to 8.13 (docs/VERSIONS.md; X-07 documented-pin route, no wrapper).
# Emulator jobs are a permanent no-go (D-24).
name: jvm-core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jvm-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-core:
    name: JVM tests - core modules
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # Chaquopy 17 needs a build-machine Python 3.13 (docs/VERSIONS.md)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Disk before build
        run: df -h / | tail -1
      - name: Core JVM tests
        shell: bash
        run: |
          set +e
          gradle :core:common:test :core:model:test :core:broker:test :core:engine:test :core:data:test :core:devapi:test :core:designsystem:test :runtime:js:test --continue --console=plain --stacktrace 2>&1 | tee /tmp/jvm.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "^> Task .*FAILED" /tmp/jvm.log | head -2 | while read -r l; do echo "::error::${l:0:250}"; done
            exit "$rc"
          fi
      - name: Failing test details
        if: failure()
        shell: bash
        run: |
          python3 tools/test_report_digest.py . | head -6 | while read -r l; do echo "::error::${l:0:250}"; done
          grep -E "^[a-zA-Z].* > .*FAILED$|^ +[a-z]+\.[a-zA-Z.0-9]*(Exception|Error): |^ +Condition not satisfied|^ +Expected|^ +     but:" /tmp/jvm.log | head -6 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Kotlin errors 1-9
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " /tmp/jvm.log | head -9 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Kotlin errors 10-18
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " /tmp/jvm.log | tail -n +10 | head -9 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Kotlin errors 19-27
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " /tmp/jvm.log | tail -n +19 | head -9 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-core-test-reports-${{ github.run_number }}
          path: "**/build/reports/tests/"
          if-no-files-found: warn
          retention-days: 7
