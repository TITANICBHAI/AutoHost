# JVM capabilities + app sweep — split out of ci.yml on the owner's instruction (2026-11-04):
# this long job runs in its own workflow with its own concurrency group, so fast iteration on
# ci.yml (python-suites + jvm-core) does not wait on it, and it is not cancelled by unrelated
# ci.yml re-runs. Triggered by the same pushes; results are independent.
# Gradle is pinned to 8.13 (docs/VERSIONS.md). Emulator jobs are a permanent no-go (D-24).
name: jvm-capabilities

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jvm-capabilities-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-capabilities:
    name: JVM tests - capabilities and app
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # Chaquopy 17 needs a build-machine Python 3.13 (docs/VERSIONS.md)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Disk before build
        run: df -h / | tail -1
      # P15/X-17 note: socket-based modules (shell/net/notifications) hang for minutes when the
      # runner's loopback is in its cold state (X-17-anomaly) — they run LAST and as separate
      # steps so one hang cannot consume the whole job; everything else verifies first.
      - name: JVM tests — non-socket capabilities
        shell: bash
        run: |
          set +e
          gradle :capabilities:a11y:test :capabilities:app:test :capabilities:ime:test :capabilities:screen:test :capabilities:projection:test :capabilities:clipboard:test :capabilities:intents:test :capabilities:files:test :capabilities:audio:test :capabilities:browser:test :capabilities:vision:test :capabilities:data:test :plugin-sdk:test --continue --console=plain --stacktrace 2>&1 | tee /tmp/jvm.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "^> Task .*FAILED" /tmp/jvm.log | head -4 | while read -r l; do echo "::error::${l:0:250}"; done
            exit "$rc"
          fi
      - name: JVM tests — runtimes and app
        shell: bash
        run: |
          set +e
          gradle :runtime:python:test :runtime:flow:test :app:test :testing:fixture-app:test --continue --console=plain --stacktrace 2>&1 | tee /tmp/jvm2.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "^> Task .*FAILED" /tmp/jvm2.log | head -4 | while read -r l; do echo "::error::${l:0:250}"; done
            exit "$rc"
          fi
      - name: JVM tests — socket-based capabilities (X-17-anomaly watch)
        shell: bash
        run: |
          set +e
          gradle :capabilities:notifications:test :capabilities:net:test :capabilities:rawbridge:test :capabilities:shell:test --continue --console=plain --stacktrace 2>&1 | tee /tmp/jvm3.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "^> Task .*FAILED" /tmp/jvm3.log | head -4 | while read -r l; do echo "::error::${l:0:250}"; done
            exit "$rc"
          fi
      - name: Failing test details
        if: failure()
        shell: bash
        run: |
          python3 tools/test_report_digest.py . | head -15 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Build failure block
        if: failure()
        shell: bash
        run: |
          sed -n '/FAILURE: Build failed/,/^\* Try:/p' /tmp/jvm.log | head -30 | while read -r l; do echo "::error::${l:0:250}"; done
          grep -B2 -A8 "What went wrong" /tmp/jvm.log | head -20 | while read -r l; do echo "::error::${l:0:250}"; done
          grep -E "^[a-zA-Z].* > .*FAILED$|^ +[a-z]+\.[a-zA-Z.0-9]*(Exception|Error): |^ +Condition not satisfied|^ +Expected|^ +     but:" /tmp/jvm.log | head -15 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Kotlin errors 1-9
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " /tmp/jvm.log | head -9 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Kotlin errors 10-18
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " /tmp/jvm.log | tail -n +10 | head -9 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Kotlin errors 19-27
        if: failure()
        shell: bash
        run: |
          grep -E "^e: " /tmp/jvm.log | tail -n +19 | head -9 | while read -r l; do echo "::error::${l:0:250}"; done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-capabilities-test-reports-${{ github.run_number }}
          path: "**/build/reports/tests/"
          if-no-files-found: warn
          retention-days: 7
