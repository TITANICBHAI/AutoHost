# JVM capabilities + app sweep — split out of ci.yml on the owner's instruction (2026-11-04):
# this long job runs in its own workflow with its own concurrency group, so fast iteration on
# ci.yml (python-suites + jvm-core) does not wait on it, and it is not cancelled by unrelated
# ci.yml re-runs. Triggered by the same pushes; results are independent.
# Gradle is pinned to 8.13 (docs/VERSIONS.md). Emulator jobs are a permanent no-go (D-24).
name: jvm-capabilities

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jvm-capabilities-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-capabilities:
    name: JVM tests - capabilities and app
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # Chaquopy 17 needs a build-machine Python 3.13 (docs/VERSIONS.md)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Disk before build
        run: df -h / | tail -1
      # X-17-anomaly: one STEP PER MODULE — a wedged module is pinpointed by name and cannot
      # consume the other modules' verification. Socket-based modules run last.
      - name: JVM tests :capabilities:a11y
        shell: bash
        run: |
          set +e
          gradle :capabilities:a11y:test --continue --console=plain --stacktrace 2>&1 | tee /tmp/jvm.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E "^> Task .*FAILED" /tmp/jvm.log | head -4 | while read -r l; do echo "::error::${l:0:250}"; done
            exit "$rc"
          fi

      - name: JVM tests :capabilities:app
