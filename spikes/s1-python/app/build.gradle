plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'app.autohost.spike.s1'
    compileSdk 35

    defaultConfig {
        applicationId 'app.autohost.spike.s1'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        pip {
            install('requests==2.34.2')
        }
    }
}
