# DRAFT — NOT ACTIVE. Adapted on 2026-11-03 from the second planning pack's ci.yml.
# It lives in drafts/ so it cannot run by accident. X-08 promotes it to .github/workflows/ci.yml, and only after the owner decides where
# builds run (D-22). Nothing in it has ever been executed. Known gaps before promotion: there is no Gradle wrapper yet (X-07), so the
# runner's default Gradle is used and may not match the pin in docs/VERSIONS.md; there is no emulator job; the tools it calls were
# checked to exist, not to pass on a runner.
# CI — the sandbox-free half of the verification story (P11-09, Gate 11-e).
# Runs the suites that need no Android SDK; Gradle jobs run when a runner has one.
# The device gates (Gates 1-11 hardware evidence) stay with the owner — see docs/GATES.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SDK + sim suite
        run: cd sdk-python && python3 -m unittest discover -s tests -t tests -p "test_*.py"
      - name: Schema + generated-artifact suite
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Progress tracker consistency
        run: python3 tools/progress.py --check
      - name: Docs consistency (paths, task/ADR/gate/RM ids, docs index)
        run: python3 tools/doc_check.py
      - name: Generated artifacts drift
        run: python3 tools/gen_artifacts.py --check
      - name: Bundled SDK copy drift
        run: python3 tools/sync_sdk.py --check
      - name: Golden flow vectors
        run: python3 tools/gen_flow_vectors.py && git diff --exit-code testing/golden/flow_vectors.json
      - name: Golden schedule vectors
        run: python3 tools/gen_schedule_vectors.py && git diff --exit-code testing/golden/schedule_vectors.json
      - name: Licence check (Gate 11-e)
        run: python3 tools/licence_check.py
      - name: MCP evals
        run: python3 tools/mcp_eval.py

  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: All JVM unit tests
        run: gradle test
      - name: Debug assemblies (core + fixture)
        run: gradle :app:assembleCoreDebug :testing:fixture-app:assembleDebug
